[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enviador-pdf-xml"
dynamic = ["version"]
description = "Enviador de PDF + XML por e-mail (conta Microsoft)"
requires-python = ">=3.11"
dependencies = [
    "tcm-ui>=1.3.0",
    "msal>=1.39,<2",
    "msal-extensions>=1.3.1,<2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[project.entry-points."sistema_financeiro.modulos"]
enviador_pdf_xml = "enviador_pdf_xml.modulo:MODULO"

[tool.setuptools.dynamic]
version = {attr = "enviador_pdf_xml.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
