[smtp]
host = smtp.office365.com
porta = 587
; starttls (porta 587) ou ssl (porta 465)
seguranca = starttls
; A SENHA NÃO FICA NESTE ARQUIVO. Guarde-a no cofre do sistema com:
;     python configurar_senha.py
usuario = seu.email@empresa.com.br
; pausa entre um e-mail e outro (evita bloqueio por excesso de envios)
intervalo_segundos = 2

[email]
remetente = seu.email@empresa.com.br
destinatario = destino@exemplo.com.br
; opcional, deixe vazio se não quiser cópia
copia =
; {nome} será trocado pelo nome do arquivo (sem extensão), ex.: 123814
assunto = EMPRESA - CTE {nome} - TEXTO FIXO DO ASSUNTO

[pastas]
entrada = entrada
enviados = enviados
erros = erros
